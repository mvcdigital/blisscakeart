<div class="footer-bg">
    <div class="container">
        <div class="footer">
            {{ with .Site.GetPage "master" }}
                <div>
                    <p>&copy; Bliss Cake Art {{ dateFormat "2006" now }}</p>
                    <a href="/pages/terms-and-conditions/">Terms and conditions</a>
                </div>
                <div class="social">
                    <a href="{{ .Params.FacebookUrl }}" target="_blank"><img src="/img/icon-fb.jpg" alt="Facebook" /></a>
                    <a href="{{ .Params.InstagramUrl }}" target="_blank"><img src="/img/icon-insta.jpg" alt="Instagram" /></a>
                </div>
                <div class="images">
                    <a href="{{ .Params.FoodHygieneRatingUrl }}" target="_blank"><img src="/img/food-hygiene.jpg" alt="Food Hygiene Rating" /></a>
                    <img src="/img/cake-international-gold.png" alt="Cake International Competition Gold 2023" />
                    <img src="/img/cake-international-gold-2024.png" alt="Cake International Competition Gold 2024" />
                    <img src="/img/cake-international-gold-2025.png" alt="Cake International Competition Gold 2025" />
                    <img src="/img/featured-jan-2026.png" alt="Featured in D'Licious Mag 2026" />
                </div>
            {{ end }}
        </div>
    </div>
</div>
